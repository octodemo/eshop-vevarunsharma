name: "Squad Retro"
on:
  schedule:
    - cron: "35 2 * * 1"  # Friendly format: weekly on monday (scattered)
    - cron: "35 */6 * * *"  # Friendly format: every 6h (scattered)
  workflow_dispatch:
    inputs:
      aw_context:
        description: Originating agentic workflow context
        required: false
        type: string
      request_fingerprint:
        description: "Stable fail: or review: fingerprint, when already known"
        required: false
        type: string
      request_origin:
        description: Origin of the request (manual, squad-review, squad-implement, or ralph)
        required: false
        type: string
      retro_reason:
        description: "Entry path: manual, early-evidence, or drain"
        required: false
        type: string

permissions: {}

concurrency:
  cancel-in-progress: false
  group: squad-retro
  queue: max

run-name: Squad retro — ${{ github.event.inputs.retro_reason || 'scheduled/drain' }}

env:
  OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.GH_AW_DEFAULT_OTLP_ENDPOINT || vars.GH_AW_DEFAULT_OTLP_ENDPOINT }}
  OTEL_SERVICE_NAME: gh-aw.squad-retro
  OTEL_RESOURCE_ATTRIBUTES: 'gh-aw.workflow.name=Squad%20Retro,gh-aw.repository=${{ github.repository }},gh-aw.run.id=${{ github.run_id }},github.run_id=${{ github.run_id }},gh-aw.engine.id=copilot'
  OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.GH_AW_DEFAULT_OTLP_HEADERS }}
  GH_AW_OTLP_ENDPOINTS: '[{"url":"${{ secrets.GH_AW_DEFAULT_OTLP_ENDPOINT || vars.GH_AW_DEFAULT_OTLP_ENDPOINT }}","headers":"${{ secrets.GH_AW_DEFAULT_OTLP_HEADERS }}"}]'
  GH_AW_OTLP_IF_MISSING: ignore

