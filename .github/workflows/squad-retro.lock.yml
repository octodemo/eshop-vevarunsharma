e, last-command, and next-action fields. For a nonterminal state, the next-action value must consist of a backticked /squad command; put explanatory prose in a separate field. Structured data is normalized by the writer.\",\"required\":true,\"type\":\"string\"}},\"max\":1,\"output\":\"Lifecycle state updated.\"},\"upsert-research-artifact\":{\"description\":\"Create or replace the single Squad research artifact for this issue.\",\"inputs\":{\"body\":{\"default\":null,\"description\":\"Complete research Markdown with an H2 Squad Research heading and all required sections; structured data is normalized by the writer.\",\"required\":true,\"type\":\"string\"}},\"max\":1,\"output\":\"Research artifact updated.\"},\"upsert-retro-state\":{\"description\":\"Replace the authoritative structured state comment after a completed retro.\",\"inputs\":{\"completed_at\":{\"default\":null,\"description\":\"ISO-8601 completion timestamp.\",\"required\":true,\"type\":\"string\"},\"cooldown_hours\":{\"default\":null,\"description\":\"Configured cooldown.\",\"required\":true,\"type\":\"string\"},\"issue_number\":{\"default\":null,\"description\":\"Durable Squad retro state issue number.\",\"required\":true,\"type\":\"string\"},\"last_full_completed_at\":{\"default\":null,\"description\":\"ISO-8601 timestamp of the latest manual or weekly full report.\",\"required\":true,\"type\":\"string\"},\"pending_fingerprints\":{\"default\":null,\"description\":\"JSON array of request fingerprints still pending.\",\"required\":true,\"type\":\"string\"},\"resolved_fingerprints\":{\"default\":null,\"description\":\"JSON array of request fingerprints resolved by this retro.\",\"required\":true,\"type\":\"string\"},\"retro_id\":{\"default\":null,\"description\":\"Numeric workflow run identifier.\",\"required\":true,\"type\":\"string\"},\"threshold\":{\"default\":null,\"description\":\"Configured independent-attempt threshold.\",\"required\":true,\"type\":\"string\"},\"window_hours\":{\"default\":null,\"