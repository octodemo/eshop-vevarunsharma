          printf '{"version":1,"component":"agent","run_id":%s,"run_attempt":%s,"state":"not_started"}\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$evidence_tmp"
          mv "$evidence_tmp" "/tmp/gh-aw/agent_execution.json"
      - name: Create gh-aw temp directory
        run: bash "${RUNNER_TEMP}/gh-aw/actions/create_gh_aw_tmp_dir.sh"
      - name: Configure gh CLI for GitHub Enterprise
        run: bash "${RUNNER_TEMP}/gh-aw/actions/configure_gh_for_ghe.sh"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Download activation artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: activation
          path: /tmp/gh-aw
      - name: Restore ambient folders from activation artifact
        env:
          GH_AW_AMBIENT_FOLDERS: ".squad"
        run: |
          for folder in $GH_AW_AMBIENT_FOLDERS; do
            src="/tmp/gh-aw/ambient-folders/$folder"
            dst="$GITHUB_WORKSPACE/$folder"
            if [ -e "$src" ]; then
              mkdir -p "$(dirname "$dst")"
              rm -rf "$dst"
              cp -a "$src" "$dst"
            fi
          done
      - continue-on-error: true
        name: Restore Squad state from activation artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: squad-state
          path: ${{ github.workspace }}

      - name: Configure Git credentials
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "${RUNNER_TEMP}/gh-aw/actions/configure_git_credentials.sh"
      - name: Checkout PR branch
        id: checkout-pr
        if: |
          github.event.pull_request || github.event.issue.pull_request || github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.aw_context || '{}').item_type == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_MCP_SERVER_TOKEN || secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          github-token: ${{ secrets.GH_AW_GITHUB_MCP_SERVER_TOKEN || secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'checkout_pr_branch.cjs'));
            await main();
      - name: Install GitHub Copilot CLI
        run: bash "${RUNNER_TEMP}/gh-aw/actions/install_copilot_cli.sh" 1.0.78
        env:
          GH_HOST: github.com
      - name: Install AWF binary
        run: bash "${RUNNER_TEMP}/gh-aw/actions/install_awf_binary.sh" v0.28.23 --rootless
      - name: Determine automatic lockdown mode for GitHub MCP Server
        id: determine-automatic-lockdown
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 (source v9)
        env:
          GH_AW_GITHUB_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN }}
          GH_AW_GITHUB_MCP_SERVER_TOKEN: ${{ secrets.GH_AW_GITHUB_MCP_SERVER_TOKEN }}
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const determineAutomaticLockdown = require(path.join(actionsDir, 'determine_automatic_lockdown.cjs'));
            await determineAutomaticLockdown(github, context, core);
      - name: Restore agent config folders from base branch
        if: steps.checkout-pr.outcome == 'success'
        env:
          GH_AW_AGENT_FOLDERS: ".agents .github .squad"
          GH_AW_AGENT_FILES: "AGENTS.md"
        run: bash "${RUNNER_TEMP}/gh-aw/actions/restore_base_github_folders.sh"
      - name: Restore ambient folders from activation artifact
        env:
          GH_AW_AMBIENT_FOLDERS: ".squad"
        run: |
          for folder in $GH_AW_AMBIENT_FOLDERS; do
            src="/tmp/gh-aw/ambient-folders/$folder"
            dst="$GITHUB_WORKSPACE/$folder"
            if [ -e "$src" ]; then
              mkdir -p "$(dirname "$dst")"
              rm -rf "$dst"
              cp -a "$src" "$dst"
            fi
          done
      - name: Restore inline sub-agents from activation artifact
        env:
          GH_AW_SUB_AGENT_DIR: ".github/agents"
          GH_AW_SUB_AGENT_EXT: ".agent.md"
        run: bash "${RUNNER_TEMP}/gh-aw/actions/restore_inline_sub_agents.sh"
      - name: Restore inline skills from activation artifact
        env:
          GH_AW_SKILL_DIR: ".github/skills"
        run: bash "${RUNNER_TEMP}/gh-aw/actions/restore_inline_skills.sh"
      - name: Materialize canonical built-in support agents
        run: "set -euo pipefail\nbuiltins_src=\"${GITHUB_WORKSPACE:?}/.github/workflows/shared/builtins\"\nsquad_agents=\"${GITHUB_WORKSPACE:?}/.squad/agents\"\nfor pair in \"scribe:Scribe\" \"ralph:Ralph\" \"rai:Rai\" \"fact-checker:Fact Checker\"; do\n  id=\"${pair%%:*}\"\n  display=\"${pair#*:}\"\n  src=\"${builtins_src}/${id}-charter.md\"\n  if [ ! -f \"$src\" ]; then\n    printf 'Canonical built-in charter resource is missing: %s\\n' \"$src\" >&2\n    exit 1\n  fi\n  dest_dir=\"${squad_agents}/${id}\"\n  mkdir -p \"$dest_dir\"\n  cp \"$src\" \"${dest_dir}/charter.md\"\n  if [ ! -f \"${dest_dir}/history.md\" ]; then\n    printf '# %s — History\\n\\n## Learnings\\n\\nInitial scaffold via gh-aw Cast. Ready for work.\\n' \"$display\" > \"${dest_dir}/history.md\"\n  fi\ndone\n"
        shell: bash
      - name: Prepare deterministic Cast validator runner
        run: "set -euo pipefail\nvalidator_runner=\"${GITHUB_WORKSPACE:?}/.github/workflows/run-squad-cast-validator\"\ncat > \"$validator_runner\" <<'SQUAD_CAST_VALIDATOR_RUNNER'\n#!/usr/bin/env bash\nset -u -o pipefail\ncd \"${GITHUB_WORKSPACE:?}\"\n\nstderr_file=\"${GITHUB_WORKSPACE:?}/.github/workflows/squad-cast-validator.stderr\"\nvalidator_script=\"${GITHUB_WORKSPACE:?}/.github/workflows/shared/squad-cast-validator.mjs\"\nvalidator_output=\"${GITHUB_WORKSPACE:?}/.github/workflows/squad-cast-validator.stdout\"\nexpected_output=\"${GITHUB_WORKSPACE:?}/.github/workflows/squad-cast-validator.expected\"\n\nfail_cast() {\n  local stage=\"$1\"\n  local command_category=\"$2\"\n  local exit_status=\"$3\"\n  node - \"$stage\" \"$command_category\" \"$exit_status\" \"$stderr_file\" <<'NODE'\nconst fs = require('node:fs');\nconst [stage, commandCategory, exitStatus, stderrPath] = process.argv.slice(2);\nprocess.stdout.write(`${JSON.stringify({\n  outcome: 'cast_failure',\n  stage,\n  command_category: commandCategory,\n  exit_status: exitStatus,\n  stderr: fs.readFileSync(stderrPath, 'utf8'),\n})}\\n`);\nNODE\n  cat \"$stderr_file\" >&2\n  exit \"$exit_status\"\n}\n\n: > \"$stderr_file\"\nif [ ! -f \"$validator_script\" ]; then\n  printf 'Cast validator resource is missing: %s\\n' \"$validator_script\" > \"$stderr_file\"\n  fail_cast \"discovery\" \"validator resource discovery\" \"1\"\nfi\nif [ ! -r \"$validator_script\" ]; then\n  printf 'Cast validator resource is not readable: %s\\n' \"$validator_script\" > \"$stderr_file\"\n  fail_cast \"discovery\" \"validator resource discovery\" \"1\"\nfi\nvalidator_script=\"$(cd \"$(dirname \"$validator_script\")\" && pwd -P)/$(basename \"$validator_script\")\"\n\nvalidator_expected_sha256=\"62fbf47b51639fd1878c143e5176ee3099e390065997411511e9d483d467bbce\"\n: > \"$stderr_file\"\nvalidator_actual_sha256=\"$(\n  node -e 'const c=require(\"node:crypto\"),f=require(\"node:fs\");process.stdout.write(c.createHash(\"sha256\").update(f.readFileSync(process.argv[1])).digest(\"hex\"))' \\\n    \"$validator_script\" 2> \"$stderr_file\"\n)\"\nstatus=$?\nif [ \"$status\" -ne 0 ]; then\n  fail_cast \"integrity\" \"SHA-256 authentication\" \"$status\"\nfi\nif [ \"$validator_actual_sha256\" != \"$validator_expected_sha256\" ]; then\n  printf 'Cast validator SHA-256 mismatch: expected %s, got %s.\\n' \\\n    \"$validator_expected_sha256\" \"$validator_actual_sha256\" > \"$stderr_file\"\n  fail_cast \"integrity\" \"SHA-256 authentication\" \"1\"\nfi\n\n: > \"$stderr_file\"\nnode --check \"$validator_script\" > /dev/null 2> \"$stderr_file\"\nstatus=$?\nif [ \"$status\" -ne 0 ]; then\n  fail_cast \"syntax\" \"node --check\" \"$status\"\nfi\n\n: > \"$stderr_file\"\nnode \"$validator_script\" \\\n  --root \"$PWD\" \\\n  --payload \"${GITHUB_WORKSPACE:?}/.github/workflows/squad-cast-payload.json\" \\\n  > \"$validator_output\" 2> \"$stderr_file\"\nstatus=$?\nif [ \"$status\" -ne 0 ]; then\n  fail_cast \"validation\" \"validator execution\" \"$status\"\nfi\n\nprintf 'Cast validation passed.\\n' > \"$expected_output\"\nif ! cmp -s \"$expected_output\" \"$validator_output\"; then\n  validator_observed=\"$(cat \"$validator_output\")\"\n  printf 'Cast validator did not emit the exact authorization output: <%s>\\n' \\\n    \"$validator_observed\" > \"$stderr_file\"\n  fail_cast \"validation\" \"validator execution\" \"1\"\nfi\ncat \"$validator_output\"\nSQUAD_CAST_VALIDATOR_RUNNER\nchmod 500 \"$validator_runner\"\n"
        shell: bash
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        name: Validate improvement command before the agent
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |-
            const { join } = require('node:path');
            const { pathToFileURL } = require('node:url');
            const gate = await import(pathToFileURL(join(process.env.GITHUB_WORKSPACE,
              '.github/workflows/shared/squad-improvement-gate.mjs')).href);
            const result = await gate.validateImprovementCommand(context.payload, process.env);
            if (!result.ok) core.setFailed(gate.describeViolations(result.violations).join('; '));

      - name: Download container images
