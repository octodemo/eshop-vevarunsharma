          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_API_URL: ${{ github.api_url }}
          GH_AW_SAFE_OUTPUT_JOBS: "{\"cast_failure\":\"\",\"upsert_lifecycle_state\":\"\",\"upsert_research_artifact\":\"\"}"
          GH_AW_SAFE_OUTPUTS_HANDLER_CONFIG: "{\"add_comment\":{\"max\":20,\"target\":\"*\"},\"add_labels\":{\"allowed\":[\"squad\",\"squad:*\"],\"create_if_missing\":true,\"max\":110,\"target\":\"*\"},\"create_issue\":{\"labels\":[\"squad\"],\"max\":75,\"require_temporary_id\":true},\"create_pull_request\":{\"allowed_base_branches\":[\"squad/*\"],\"allowed_files\":[\".squad/**\",\".github/agents/*.agent.md\",\"meet-the-squad.md\"],\"auto_close_issue\":false,\"expires\":336,\"labels\":[\"squad\"],\"max\":3,\"max_patch_files\":500,\"max_patch_size\":4096,\"protect_top_level_dot_folders\":true,\"protected_files\":[\"package.json\",\"bun.lockb\",\"bunfig.toml\",\"deno.json\",\"deno.jsonc\",\"deno.lock\",\"global.json\",\"NuGet.Config\",\"Directory.Packages.props\",\"mix.exs\",\"mix.lock\",\"go.mod\",\"go.sum\",\"stack.yaml\",\"stack.yaml.lock\",\"pom.xml\",\"build.gradle\",\"build.gradle.kts\",\"settings.gradle\",\"settings.gradle.kts\",\"gradle.properties\",\"package-lock.json\",\"yarn.lock\",\"pnpm-lock.yaml\",\"npm-shrinkwrap.json\",\"requirements.txt\",\"Pipfile\",\"Pipfile.lock\",\"pyproject.toml\",\"setup.py\",\"setup.cfg\",\"Gemfile\",\"Gemfile.lock\",\"uv.lock\",\"CODEOWNERS\",\"DESIGN.md\",\"README.md\",\"CONTRIBUTING.md\",\"SECURITY.md\",\"CODE_OF_CONDUCT.md\",\"AGENTS.md\"],\"protected_files_policy\":\"allowed\",\"title_prefix\":\"[squad] \"},\"create_report_incomplete_issue\":{},\"dispatch_workflow\":{\"allowed_refs\":[\"refs/heads/${{ github.event.repository.default_branch }}\"],\"aw_context_workflows\":[\"squad-implement-worker\",\"squad-deps-worker\",\"squad-review\",\"squad-retro\",\"squad-improvement-worker\"],\"max\":3,\"workflow_files\":{\"squad-deps-worker\":\".lock.yml\",\"squad-implement-worker\":\".lock.yml\",\"squad-improvement-worker\":\".lock.yml\",\"squad-retro\":\".lock.yml\",\"squad-review\":\".lock.yml\"},\"workflows\":[\"squad-implement-worker\",\"squad-deps-worker\",\"squad-review\",\"squad-retro\",\"squad-improvement-worker\"]},\"missing_data\":{},\"missing_tool\":{},\"noop\":{\"max\":1,\"report-as-issue\":\"false\"},\"report_incomplete\":{}}"
          GH_AW_CI_TRIGGER_TOKEN: ${{ secrets.GH_AW_CI_TRIGGER_TOKEN }}
        with:
