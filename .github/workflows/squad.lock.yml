          GH_AW_SAFE_OUTPUTS_CONFIG: "{\"add_comment\":{\"data_enabled\":true,\"data_schema\":{\"additionalProperties\":false,\"properties\":{\"origin_issue\":{\"minimum\":1,\"type\":\"integer\"},\"phases\":{\"items\":{\"minimum\":1,\"type\":\"integer\"},\"type\":\"array\"},\"schema_version\":{\"enum\":[\"1\"],\"type\":\"string\"},\"squad_artifact\":{\"enum\":[\"research\",\"plan\",\"plan-accepted\",\"phases-accepted\",\"triage\",\"lifecycle-state\",\"program\",\"implementation\",\"validation\",\"scope-accepted\",\"impl-accepted\",\"impl-phases-accepted\",\"phases-activated\",\"activated\"],\"type\":\"string\"}},\"required\":[\"origin_issue\",\"phases\",\"schema_version\",\"squad_artifact\"],\"type\":\"object\"},\"max\":20,\"target\":\"*\"},\"add_labels\":{\"allowed\":[\"squad\",\"squad:*\"],\"create_if_missing\":true,\"max\":110,\"target\":\"*\"},\"cast-failure\":{\"description\":\"Fail a Cast run from an emitted factual failure record.\",\"inputs\":{\"command_category\":{\"default\":null,\"description\":\"Exact command category for the stage.\",\"required\":true,\"type\":\"string\"},\"exit_status\":{\"default\":null,\"description\":\"Observed command exit status, or unavailable when the command did not start.\",\"required\":true,\"type\":\"string\"},\"stage\":{\"default\":null,\"description\":\"Bounded Cast failure stage.\",\"required\":true,\"type\":\"string\"},\"stderr\":{\"default\":null,\"description\":\"Complete observed stderr without diagnosis or rewriting, including an empty string.\",\"required\":true,\"type\":\"string\"}},\"max\":1},\"create_issue\":{\"data_enabled\":true,\"data_schema\":{\"additionalProperties\":false,\"properties\":{\"origin_issue\":{\"minimum\":1,\"type\":\"integer\"},\"phases\":{\"items\":{\"minimum\":1,\"type\":\"integer\"},\"type\":\"array\"},\"schema_version\":{\"enum\":[\"1\"],\"type\":\"string\"},\"squad_artifact\":{\"enum\":[\"research\",\"plan\",\"plan-accepted\",\"phases-accepted\",\"triage\",\"lifecycle-state\",\"program\",\"implementation\",\"validation\",\"scope-accepted\",\"impl-accepted\",\"impl-phases-accepted\",\"phases-activated\",\"activated\"],\"type\":\"string\"}},\"required\":[\"origin_issue\",\"phases\",\"schema_version\",\"squad_artifact\"],\"type\":\"object\"},\"labels\":[\"squad\"],\"max\":75,\"require_temporary_id\":true},\"create_pull_request\":{\"allowed_base_branches\":[\"squad/*\"],\"allowed_files\":[\".squad/**\",\".github/agents/*.agent.md\",\"meet-the-squad.md\"],\"auto_close_issue\":false,\"data_enabled\":true,\"data_schema\":{\"additionalProperties\":false,\"properties\":{\"origin_issue\":{\"minimum\":1,\"type\":\"integer\"},\"phases\":{\"items\":{\"minimum\":1,\"type\":\"integer\"},\"type\":\"array\"},\"schema_version\":{\"enum\":[\"1\"],\"type\":\"string\"},\"squad_artifact\":{\"enum\":[\"research\",\"plan\",\"plan-accepted\",\"phases-accepted\",\"triage\",\"lifecycle-state\",\"program\",\"implementation\",\"validation\",\"scope-accepted\",\"impl-accepted\",\"impl-phases-accepted\",\"phases-activated\",\"activated\"],\"type\":\"string\"}},\"required\":[\"origin_issue\",\"phases\",\"schema_version\",\"squad_artifact\"],\"type\":\"object\"},\"expires\":336,\"labels\":[\"squad\"],\"max\":3,\"max_patch_files\":500,\"max_patch_size\":4096,\"protect_top_level_dot_folders\":true,\"protected_files\":[\"package.json\",\"bun.lockb\",\"bunfig.toml\",\"deno.json\",\"deno.jsonc\",\"deno.lock\",\"global.json\",\"NuGet.Config\",\"Directory.Packages.props\",\"mix.exs\",\"mix.lock\",\"go.mod\",\"go.sum\",\"stack.yaml\",\"stack.yaml.lock\",\"pom.xml\",\"build.gradle\",\"build.gradle.kts\",\"settings.gradle\",\"settings.gradle.kts\",\"gradle.properties\",\"package-lock.json\",\"yarn.lock\",\"pnpm-lock.yaml\",\"npm-shrinkwrap.json\",\"requirements.txt\",\"Pipfile\",\"Pipfile.lock\",\"pyproject.toml\",\"setup.py\",\"setup.cfg\",\"Gemfile\",\"Gemfile.lock\",\"uv.lock\",\"CODEOWNERS\",\"DESIGN.md\",\"README.md\",\"CONTRIBUTING.md\",\"SECURITY.md\",\"CODE_OF_CONDUCT.md\",\"AGENTS.md\"],\"protected_files_policy\":\"allowed\",\"title_prefix\":\"[squad] \"},\"create_report_incomplete_issue\":{},\"dispatch_workflow\":{\"allowed_refs\":[\"refs/heads/${{ github.event.repository.default_branch }}\"],\"aw_context_workflows\":[\"squad-implement-worker\",\"squad-deps-worker\",\"squad-review\",\"squad-retro\",\"squad-improvement-worker\"],\"max\":3,\"workflow_files\":{\"squad-deps-worker\":\".lock.yml\",\"squad-implement-worker\":\".lock.yml\",\"squad-improvement-worker\":\".lock.yml\",\"squad-retro\":\".lock.yml\",\"squad-review\":\".lock.yml\"},\"workflows\":[\"squad-implement-worker\",\"squad-deps-worker\",\"squad-review\",\"squad-retro\",\"squad-improvement-worker\"]},\"missing_data\":{},\"missing_tool\":{},\"noop\":{\"max\":1,\"report-as-issue\":\"false\"},\"report_incomplete\":{},\"upsert-lifecycle-state\":{\"description\":\"Update the single Squad planning lifecycle comment for this issue.\",\"inputs\":{\"body\":{\"default\":null,\"description\":\"Complete lifecycle Markdown with an H2 lifecycle heading plus state, last-command, and next-action fields. For a nonterminal state, the next-action value must consist of a backticked /squad command; put explanatory prose in a separate field. Structured data is normalized by the writer.\",\"required\":true,\"type\":\"string\"}},\"max\":1,\"output\":\"Lifecycle state updated.\"},\"upsert-research-artifact\":{\"description\":\"Create or replace the single Squad research artifact for this issue.\",\"inputs\":{\"body\":{\"default\":null,\"description\":\"Complete research Markdown with an H2 Squad Research heading and all required sections; structured data is normalized by the writer.\",\"required\":true,\"type\":\"string\"}},\"max\":1,\"output\":\"Research artifact updated.\"}}"
