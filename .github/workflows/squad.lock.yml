          # shellcheck disable=SC1003,SC2016,SC2086
          awf --config "${RUNNER_TEMP}/gh-aw/awf-config.json" --container-workdir "${GITHUB_WORKSPACE}" --mount "${RUNNER_TEMP}/gh-aw:${RUNNER_TEMP}/gh-aw:ro" --mount "${RUNNER_TEMP}/gh-aw:/host${RUNNER_TEMP}/gh-aw:ro" ${GH_AW_TOOL_CACHE_MOUNT:+--mount "$GH_AW_TOOL_CACHE_MOUNT"} ${GH_AW_DOCKER_HOST:+--docker-host "$GH_AW_DOCKER_HOST"} --env-all --exclude-env ACTIONS_ID_TOKEN_REQUEST_TOKEN --exclude-env ACTIONS_ID_TOKEN_REQUEST_URL --exclude-env COPILOT_GITHUB_TOKEN --mount /tmp/gh-aw:/tmp/gh-aw:rw --mount /tmp/gh-aw/threat-detection:/tmp/gh-aw/threat-detection:rw --log-level info --skip-pull \
            -- /bin/bash -c 'set +o histexpand; export PATH="${RUNNER_TEMP}/gh-aw/bin:$PATH" && : "${RUNNER_TOOL_CACHE:?RUNNER_TOOL_CACHE must be set}"; GH_AW_TOOL_CACHE="$RUNNER_TOOL_CACHE"; GH_AW_TOOL_BINS="$(find "$GH_AW_TOOL_CACHE" -maxdepth 5 -type d -name bin 2>/dev/null | tr '\''\n'\'' '\'':'\'')"; GH_AW_TOOL_BINS="${GH_AW_TOOL_BINS%:}"; export PATH="$PATH${GH_AW_TOOL_BINS:+:}$GH_AW_TOOL_BINS"; [ -n "$GOROOT" ] && export PATH="$GOROOT/bin:$PATH" || true; [ -n "$ERLANG_HOME" ] && export PATH="$ERLANG_HOME/bin:$PATH" || true && threat-detect --engine copilot --output /tmp/gh-aw/threat-detection/detection_result.json /tmp/gh-aw/threat-detection' 2>&1 | tee -a /tmp/gh-aw/threat-detection/detection.log
      - name: Render detection log
        if: always() && steps.detection_guard.outputs.run_detection == 'true'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'render_detection_log.cjs'));
            await main();
      - name: Copy detection firewall logs
        if: always() && steps.detection_guard.outputs.run_detection == 'true'
        continue-on-error: true
        run: |
          mkdir -p /tmp/gh-aw/threat-detection/sandbox/firewall
          if [ -d /tmp/gh-aw/sandbox/firewall/logs ]; then mkdir -p /tmp/gh-aw/threat-detection/sandbox/firewall/logs && cp -r /tmp/gh-aw/sandbox/firewall/logs/. /tmp/gh-aw/threat-detection/sandbox/firewall/logs/; fi
          if [ -d /tmp/gh-aw/sandbox/firewall/audit ]; then mkdir -p /tmp/gh-aw/threat-detection/sandbox/firewall/audit && cp -r /tmp/gh-aw/sandbox/firewall/audit/. /tmp/gh-aw/threat-detection/sandbox/firewall/audit/; fi
      - name: Parse threat detection token usage for step summary
        id: parse_detection_token_usage
        if: always()
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_TOKEN_USAGE_SUMMARY_TITLE: Threat Detection Token Usage
          GH_AW_AGENT_USAGE_PATH: /tmp/gh-aw/threat-detection/detection_usage.json
          GH_AW_AGENT_USAGE_JSONL_PATH: /tmp/gh-aw/threat-detection/detection_usage.jsonl
          GH_AW_WRITE_EMPTY_USAGE: "true"
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'parse_token_usage.cjs'));
            await main();
      - name: Upload threat detection artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: detection
          path: |
            /tmp/gh-aw/threat-detection/detection_result.json
            /tmp/gh-aw/threat-detection/execution.json
            /tmp/gh-aw/threat-detection/detection_usage.json
            /tmp/gh-aw/threat-detection/detection_usage.jsonl
            /tmp/gh-aw/threat-detection/sandbox/firewall/logs/
            /tmp/gh-aw/threat-detection/sandbox/firewall/audit/
          if-no-files-found: ignore
      - name: Conclude threat detection
        id: detection_conclusion
        if: always()
        continue-on-error: true
        env:
          RUN_DETECTION: ${{ steps.detection_guard.outputs.run_detection }}
          DETECTION_AGENTIC_EXECUTION_OUTCOME: ${{ steps.detection_agentic_execution.outcome }}
          THREAT_DETECT_INSTALL_OUTCOME: ${{ steps.threat_detect_install.outcome }}
          GH_AW_DETECTION_CONTINUE_ON_ERROR: "true"
        run: |
          bash "${RUNNER_TEMP}/gh-aw/actions/conclude_threat_detection.sh" /tmp/gh-aw/threat-detection/detection_result.json

  pre_activation:
    if: "(github.event_name != 'issues' || github.actor != 'github-actions[bot]' || github.event.issue.title != '[Research Proposals] Agent-discovered repo opportunities' || !contains(github.event.issue.body, '<!-- squad:bootstrap-opportunities schema=1 -->')) && ((github.event_name == 'issues' || github.event_name == 'issue_comment') && (github.event_name == 'issues' && (startsWith(github.event.issue.body, '/squad ') || startsWith(github.event.issue.body, '/squad\n') || startsWith(github.event.issue.body, '/squad\r') || github.event.issue.body == '/squad') || github.event_name == 'issue_comment' && (startsWith(github.event.comment.body, '/squad ') || startsWith(github.event.comment.body, '/squad\n') || startsWith(github.event.comment.body, '/squad\r') || github.event.comment.body == '/squad') && github.event.issue.pull_request == null || github.event_name == 'issue_comment' && (startsWith(github.event.comment.body, '/squad ') || startsWith(github.event.comment.body, '/squad\n') || startsWith(github.event.comment.body, '/squad\r') || github.event.comment.body == '/squad') && github.event.issue.pull_request != null) || !(github.event_name == 'issues' || github.event_name == 'issue_comment'))"
    runs-on: ubuntu-slim
    env:
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
    outputs:
      activated: ${{ steps.check_command_position.outputs.command_position_ok == 'true' }}
      matched_command: ${{ steps.check_command_position.outputs.matched_command }}
      setup-parent-span-id: ${{ steps.setup.outputs.parent-span-id || steps.setup.outputs.span-id }}
      setup-span-id: ${{ steps.setup.outputs.span-id }}
      setup-trace-id: ${{ steps.setup.outputs.trace-id }}
    steps:
      - name: Setup Scripts
        id: setup
        uses: github/gh-aw-actions/setup@v0.89.21
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
          job-name: ${{ github.job }}
        env:
          GH_AW_SETUP_WORKFLOW_NAME: "Squad"
          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/squad.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "1.0.78"
          GH_AW_INFO_AWF_VERSION: "v0.28.23"
          GH_AW_INFO_BODY_MODIFIED: "false"
          GH_AW_INFO_ENGINE_ID: "copilot"
      - name: Check command position
        id: check_command_position
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_COMMANDS: "[\"squad\"]"
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'check_command_position.cjs'));
            await main();

  repair_activated_lifecycle:
    name: Repair terminal Squad lifecycle
    needs:
      - agent
      - detection
      - safe_outputs
    if: >
      ${{
      !cancelled() &&
      needs.agent.result == 'success' &&
      needs.detection.result == 'success' &&
      needs.safe_outputs.result == 'success' &&
      !contains(needs.agent.outputs.output_types, 'upsert_lifecycle_state') &&
      github.event_name == 'issue_comment' &&
      (github.event.comment.body == '/squad activate' ||
      github.event.comment.body == '/squad plan accept' ||
      github.event.comment.body == '/squad plan activate')
      }}
    runs-on: ubuntu-slim
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Configure GH_HOST for enterprise compatibility
        id: ghes-host-config
        shell: bash
        run: | # zizmor: ignore[github-env] - GITHUB_SERVER_URL is set by GitHub Actions, not user input.
          # Derive GH_HOST from GITHUB_SERVER_URL so the gh CLI targets the correct
          # GitHub instance (GHES/GHEC). On github.com this is a harmless no-op.
          GH_HOST="${GITHUB_SERVER_URL#https://}"
          GH_HOST="${GH_HOST#http://}"
          echo "GH_HOST=${GH_HOST}" >> "$GITHUB_ENV"
      - name: Repair terminal lifecycle after idempotent activation
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 (source v9)
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          SQUAD_COMMAND: ${{ github.event.comment.body }}
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const command = String(process.env.SQUAD_COMMAND || "").trim();
            if (
              !Number.isInteger(issueNumber) ||
              issueNumber <= 0 ||
              !["/squad activate", "/squad plan accept", "/squad plan activate"].includes(command)
            ) {
              core.setFailed("A valid whole-plan activation command and issue number are required.");
              return;
            }

            const actor = String(context.payload.comment?.user?.login || "").trim();
            if (!actor) {
              core.setFailed("Lifecycle repair requires an identifiable comment author.");
              return;
            }
            let permission;
            try {
              const response = await github.rest.repos.getCollaboratorPermissionLevel({
                ...context.repo,
                username: actor,
              });
              permission = String(response.data?.permission || "").toLowerCase();
            } catch (error) {
              core.setFailed(`Unable to verify lifecycle repair permission for ${actor}: ${error.message}`);
              return;
            }
            if (!["admin", "maintain", "write"].includes(permission)) {
              core.info(`Lifecycle repair is not authorized for ${actor} with ${permission || "unresolved"} permission.`);
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const trusted = comments.filter(
              (comment) => comment.user?.login === "github-actions[bot]",
            );
            const envelopeFor = (comment) => {
              const matches = String(comment.body || "").matchAll(
                /Structured data:\s*```json\s*([\s\S]*?)```/gi,
              );
              let envelope = null;
              for (const match of matches) {
                try {
                  envelope = JSON.parse(match[1]);
                } catch (error) {
                  if (!(error instanceof SyntaxError)) throw error;
                }
              }
              return envelope;
            };
            const artifacts = trusted.map((comment) => ({
              comment,
              envelope: envelopeFor(comment),
            }));
            const ok = artifacts.some(
              ({ envelope: e }) =>
                ["plan-accepted", "activated"].includes(e?.squad_artifact) &&
                e?.schema_version === "1" &&
                e?.origin_issue === issueNumber &&
                Array.isArray(e?.phases) &&
                (e.squad_artifact === "activated" || e.phases.length === 0),
            );
            if (!ok) {
              core.info("No trusted whole-plan acceptance or activation artifact; lifecycle repair is not applicable.");
              return;
            }

            const lifecycle = artifacts
              .filter(
                ({ envelope }) =>
                  envelope?.squad_artifact === "lifecycle-state" &&
                  envelope?.schema_version === "1" &&
                  envelope?.origin_issue === issueNumber,
              )
              .sort(({ comment: left }, { comment: right }) =>
                String(left.created_at).localeCompare(String(right.created_at)),
              )
              .at(-1)?.comment;
            const lifecycleBody = String(lifecycle?.body || "");
            const terminal =
              /^(?:[-*]\s+)?\*\*(?:Current state|State):\*\*\s+Activated\s*$/im.test(lifecycleBody) &&
              (/^(?:[-*]\s+)?(?:\*\*)?Activation:(?:\*\*)?\s+✅\s+Done\b/im.test(lifecycleBody) ||
                /^\|\s*Activat(?:e|ion|ed)\s*\|\s*✅\s+Done\b[^|]*\|/im.test(lifecycleBody)) &&
              /^(?:[-*]\s+)?\*\*Last command:\*\*\s+`\/squad (?:activate|plan accept|plan activate)(?: phase \d+)?`(?:\s+.*)?$/im.test(lifecycleBody);
            if (terminal) {
              core.info("The newest lifecycle tracker already records terminal activation.");
              return;
            }

            const body = [
              `## 🧭 Squad Lifecycle State — Issue #${issueNumber}`,
              "",
              "- **State:** Activated",
              "- **Plan:** ✅ Done",
              "- **Activation:** ✅ Done",
              `- **Last command:** \`${command}\``,
              "- **Next action:** Track progress on the created task issues; no further planning action is required.",
            ].join("\n");
            const data = JSON.stringify({
              squad_artifact: "lifecycle-state",
              schema_version: "1",
              origin_issue: issueNumber,
              phases: [],
            });
            const finalBody = `${body}\n\nStructured data:\n\n\`\`\`json\n${data}\n\`\`\``;

            if (lifecycle) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: lifecycle.id,
                body: finalBody,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issueNumber,
                body: finalBody,
              });
            }

  safe_outputs:
    needs:
      - activation
      - agent
      - detection
