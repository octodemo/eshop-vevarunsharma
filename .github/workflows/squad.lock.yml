name: "Squad"
on:
  # bots: # Bots processed as bot check in pre-activation job
  # - github-actions[bot] # Bots processed as bot check in pre-activation job
  issue_comment:
    types:
      - created
      - edited
  issues:
    types:
      - opened
      - edited
      - reopened
  # roles: all # Roles processed as role check in pre-activation job
  workflow_dispatch:
    inputs:
      aw_context:
        description: Originating agentic workflow context
        required: false
        type: string
      command:
        description: Squad command (e.g., cast, implement, connect org/repo, adopt org/repo, status)
        required: false
      issue_number:
        description: Issue number to implement when run manually
        required: false
        type: string

permissions: {}

concurrency:
  cancel-in-progress: false
  group: squad-${{ github.event.inputs.issue_number || github.event.issue.number || github.event.pull_request.number || github.run_id }}

run-name: Squad — ${{ github.event.inputs.command || github.event.comment.body || github.event.issue.title || 'run' }}

env:
  OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.GH_AW_DEFAULT_OTLP_ENDPOINT || vars.GH_AW_DEFAULT_OTLP_ENDPOINT }}
  OTEL_SERVICE_NAME: gh-aw.squad
  OTEL_RESOURCE_ATTRIBUTES: 'gh-aw.workflow.name=Squad,gh-aw.repository=${{ github.repository }},gh-aw.run.id=${{ github.run_id }},github.run_id=${{ github.run_id }},gh-aw.engine.id=copilot'
  OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.GH_AW_DEFAULT_OTLP_HEADERS }}
  GH_AW_OTLP_ENDPOINTS: '[{"url":"${{ secrets.GH_AW_DEFAULT_OTLP_ENDPOINT || vars.GH_AW_DEFAULT_OTLP_ENDPOINT }}","headers":"${{ secrets.GH_AW_DEFAULT_OTLP_HEADERS }}"}]'
  GH_AW_OTLP_IF_MISSING: ignore

