  cast_failure:
    name: Fail incomplete Cast
    needs:
      - agent
      - detection
    if: (!cancelled()) && needs.agent.result != 'skipped' && contains(needs.agent.outputs.output_types, 'cast_failure')
    runs-on: ubuntu-slim
    steps:
      - name: Download agent output artifact
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{agent,agent-output-fallback}"
          merge-multiple: true
          path: ${{ runner.temp }}/gh-aw/safe-jobs/
      - name: Fail Cast terminal outcome
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 (source v9)
        env:
          GH_AW_AGENT_OUTPUT: ${{ runner.temp }}/gh-aw/safe-jobs/agent_output.json
        with:
          script: |
            const fs = await import('node:fs');
            const outputPath = process.env.GH_AW_AGENT_OUTPUT;
            if (!outputPath) {
              core.setFailed('GH_AW_AGENT_OUTPUT is unavailable for the Cast failure job.');
              return;
            }
            let output;
            try {
              output = JSON.parse(fs.readFileSync(outputPath, 'utf8'));
            } catch (error) {
              core.setFailed(`Unable to read Cast failure output: ${error instanceof Error ? error.message : String(error)}`);
              return;
            }
            if (!output || !Array.isArray(output.items)) {
              core.setFailed('Cast failure output does not contain an items array.');
              return;
            }
            const malformedIndex = output.items.findIndex(
              item => item === null || typeof item !== 'object' || Array.isArray(item),
            );
            if (malformedIndex !== -1) {
              core.setFailed(`Cast failure output item ${malformedIndex} is not an object.`);
              return;
            }
            const failures = output.items.filter(item => item.type === 'cast_failure');
            if (failures.length !== 1) {
              core.setFailed(`Expected exactly one cast_failure item, found ${failures.length}.`);
              return;
            }
            const pullRequests = output.items.filter(item => item.type === 'create_pull_request');
            if (pullRequests.length > 0) {
              core.setFailed([
                `Conflicting Cast terminal outputs: found ${pullRequests.length} create_pull_request item(s) with cast_failure.`,
                'This post-agent diagnostic cannot prevent a concurrently materialized pull request.',
              ].join('\n'));
              return;
            }

            const categories = new Map([
              ['discovery', 'validator resource discovery'],
              ['integrity', 'SHA-256 authentication'],
              ['syntax', 'node --check'],
              ['validation', 'validator execution'],
            ]);
            const failure = failures[0];
            if (!categories.has(failure.stage)) {
              core.setFailed(`Invalid Cast failure stage: ${String(failure.stage)}`);
              return;
            }
            if (failure.command_category !== categories.get(failure.stage)) {
              core.setFailed(`Invalid command category for Cast failure stage ${failure.stage}.`);
              return;
            }
            if (!/^(?:[0-9]{1,3}|unavailable)$/.test(String(failure.exit_status))) {
              core.setFailed(`Invalid Cast failure exit status: ${String(failure.exit_status)}`);
              return;
            }
            if (typeof failure.stderr !== 'string') {
              core.setFailed('Cast failure stderr must be a string.');
              return;
            }

            core.setFailed([
              'Cast did not complete.',
              `Stage: ${failure.stage}`,
              `Command category: ${failure.command_category}`,
              `Exit status: ${failure.exit_status}`,
              'Stderr:',
              failure.stderr,
            ].join('\n'));

  conclusion:
    needs:
      - activation
      - agent
      - cast_failure
      - detection
      - repair_activated_lifecycle
      - safe_outputs
      - upsert_lifecycle_state
      - upsert_research_artifact
    if: >
      always() && (needs.agent.result != 'skipped' || needs.activation.outputs.lockdown_check_failed == 'true' ||
      needs.activation.outputs.oauth_token_check_failed == 'true' || needs.activation.outputs.stale_lock_file_failed == 'true' ||
      needs.activation.outputs.daily_ai_credits_exceeded == 'true' || needs.activation.outputs.daily_ai_credits_guardrail_status == 'structural_error' ||
      needs.activation.outputs.daily_ai_credits_guardrail_status == 'transient_error')
    runs-on: ubuntu-slim
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    concurrency:
      group: "gh-aw-conclusion-squad-${{ github.run_id }}"
      cancel-in-progress: false
      queue: max
    env:
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
    outputs:
      incomplete_count: ${{ steps.report_incomplete.outputs.incomplete_count }}
      noop_message: ${{ steps.noop.outputs.noop_message }}
      tools_reported: ${{ steps.missing_tool.outputs.tools_reported }}
      total_count: ${{ steps.missing_tool.outputs.total_count }}
    steps:
      - name: Setup Scripts
        id: setup
        uses: github/gh-aw-actions/setup@v0.89.21
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
          job-name: ${{ github.job }}
          trace-id: ${{ needs.activation.outputs.setup-trace-id }}
          parent-span-id: ${{ needs.activation.outputs.setup-parent-span-id || needs.activation.outputs.setup-span-id }}
        env:
          GH_AW_SETUP_WORKFLOW_NAME: "Squad"
          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/squad.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "1.0.78"
          GH_AW_INFO_AWF_VERSION: "v0.28.23"
          GH_AW_INFO_BODY_MODIFIED: "false"
          GH_AW_INFO_ENGINE_ID: "copilot"
      - name: Download agent output artifact
        id: download-agent-output
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{agent,agent-output-fallback}"
          merge-multiple: true
          path: /tmp/gh-aw/
      - name: Setup agent output environment variable
        id: setup-agent-output-env
        if: steps.download-agent-output.outcome == 'success'
        run: |
          mkdir -p /tmp/gh-aw/
          find "/tmp/gh-aw/" -type f -print
          if [ -f "/tmp/gh-aw/agent_output.json" ]; then
            echo "GH_AW_AGENT_OUTPUT=/tmp/gh-aw/agent_output.json" >> "$GITHUB_OUTPUT"
          fi
      - name: Download detection artifact
        id: download-detection-artifact
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: detection
          path: /tmp/gh-aw/threat-detection/
      - name: Download Safe Outputs Items Manifest
        id: download-safe-outputs-manifest
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: safe-outputs-items
          merge-multiple: true
          path: /tmp/gh-aw/
      - name: Collect usage artifact files
        if: always()
        continue-on-error: true
        run: bash "${RUNNER_TEMP}/gh-aw/actions/collect_usage_artifact_files.sh"
      - name: Upload usage artifact
        id: upload-usage-artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: usage
          path: |
            /tmp/gh-aw/usage/aw_info.json
            /tmp/gh-aw/usage/aw-info.jsonl
            /tmp/gh-aw/usage/agent_usage.json
            /tmp/gh-aw/usage/agent_usage.jsonl
            /tmp/gh-aw/usage/detection_usage.jsonl
            /tmp/gh-aw/usage/evals.jsonl
            /tmp/gh-aw/usage/graders/grader_manifest.json
            /tmp/gh-aw/usage/graders/grader_results.json
            /tmp/gh-aw/usage/github_rate_limits.jsonl
            /tmp/gh-aw/usage/agent/token_usage.jsonl
